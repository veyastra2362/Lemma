[package]
name = "trans"
version = "0.1.0"
description = "Trans - 高频深度阅读的轻量桌面辅助系统"
authors = ["Trans"]
edition = "2024"
rust-version = "1.85"

[lib]
# lib/bin 同名在 Windows 上会冲突，见 rust-lang/cargo#8519
name = "trans_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }

# 开发档：自己 debug=1 保留行号，依赖全量 opt-level=2（否则 ort / serde 慢到没法用）
[profile.dev]
incremental = true
debug = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = 0
opt-level = 2

# 发布档：目标是安装包 < 20MB 与冷启动 < 1.2s
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
