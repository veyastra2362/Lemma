[package]
name = "lemma"
version = "0.1.0"
description = "Lemma - 高频深度阅读的轻量桌面辅助系统"
authors = ["Lemma contributors"]
edition = "2024"


[lib]
# lib/bin 同名在 Windows 上会冲突，见 rust-lang/cargo#8519
name = "lemma_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 注意：参考实现用了 tauri 2.12 才有的窗口字段 noRedirectionBitmap，
# 但 crates.io 上 tauri 最新稳定是 2.11.6 / tauri-build 2.6.3。
# 等上游发布 2.12 后再把该字段加回 tauri.conf.json（见 docs/REFERENCE-NOTES.md）。
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
sysinfo = "0.33"
serde_json = "1"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }
redb = "4"
csv = "1"
postcard = { version = "1", features = ["alloc"] }
# 翻译层：只要 json + rustls，不引入 openssl
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
# 端侧 OCR（M4b）：ONNX Runtime 绑定 + 图像解码。
# 纯 Rust 的 tract 已被实测否决（Paddle2ONNX 的符号维度名解析不了），见 docs/ONNX-PROBE.md。
ort = "=2.0.0-rc.10"
ndarray = "0.16"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "query", "stream"] }
unicode-normalization = "0.1"
thiserror = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Console",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

# 开发档：自己 debug=1 保留行号，依赖全量 opt-level=2（否则 ort / serde 慢到没法用）
[profile.dev]
incremental = true
debug = 1
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = 0
opt-level = 2

# 发布档：目标是安装包 < 20MB 与冷启动 < 1.2s
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
